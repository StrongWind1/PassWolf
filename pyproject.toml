[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "passwolf"
dynamic = ["version"]
description = "Correct, spec-compliant Active Directory password change, reset, and policy read over SAMR, Netlogon, LSA, Kerberos, and LDAP — including the AES paths impacket lacks."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11,<3.15"
authors = [{ name = "StrongWind1" }]
keywords = [
  "active-directory",
  "samr",
  "netlogon",
  "kerberos",
  "ldap",
  "password",
  "penetration-testing",
  "red-team",
  "security",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Security",
]
dependencies = ["impacket", "pycryptodome", "rich"]

[project.urls]
Repository = "https://github.com/StrongWind1/PassWolf"
Documentation = "https://strongwind1.github.io/PassWolf/"
Changelog = "https://github.com/StrongWind1/PassWolf/blob/main/CHANGELOG.md"
Issues = "https://github.com/StrongWind1/PassWolf/issues"

[project.scripts]
passwolf = "passwolf.cli:main"

[tool.hatch.version]
path = "src/passwolf/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/passwolf"]

[tool.hatch.build.targets.sdist]
exclude = ["/site", "/docs"]

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.11", "ty>=0.0.1a7", "pre-commit>=4.0"]
docs = ["mkdocs-material>=9.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 320
src = ["src"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
  "COM812", # trailing comma placement is managed by the formatter
  "ISC001", # implicit string concatenation is managed by the formatter
  "D203",   # one-blank-line-before-class; incompatible with D211, we follow D211
  "D213",   # multi-line-summary-second-line; incompatible with D212, we follow D212
]

[tool.ruff.lint.flake8-copyright]
notice-rgx = "(?i)# SPDX-License-Identifier"

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"src/passwolf/crypto.py" = ["S303", "S304", "S305", "S324"]
"src/passwolf/ndr.py" = ["N801", "N802"]
"src/passwolf/console.py" = ["PLC0415", "FBT001"]
"src/passwolf/constants.py" = ["S105"]
"src/passwolf/policy.py" = ["S105"]
"src/passwolf/model.py" = ["S105"]
"src/passwolf/errors.py" = ["N818"]
"src/passwolf/transport.py" = ["PLR0913"]
"src/passwolf/samr.py" = ["PLR0913", "PLR0917"]
"src/passwolf/kpasswd.py" = ["PLR0913", "PLR0917"]
"src/passwolf/ldap.py" = ["PLR0913"]
"src/passwolf/netlogon.py" = ["PLR0913", "PLR0917"]
"src/passwolf/cli.py" = ["T201"]
"src/passwolf/change.py" = ["T201", "TRY400"]
"src/passwolf/reset.py" = ["T201", "TRY400"]
"src/passwolf/pwpolicy.py" = ["T201", "TRY400"]
"tests/**" = ["ALL"]

[tool.ty.environment]
python-version = "3.11"
root = ["src"]

[tool.ty.rules]
all = "error"

[tool.ty.terminal]
error-on-warning = true

[tool.ty.analysis]
replace-imports-with-any = ["impacket.**", "Crypto.**"]
allowed-unresolved-imports = []
strict-equality-semantics = true
strict-generic-narrowing = true
respect-type-ignore-comments = false

[[tool.ty.overrides]]
include = ["tests/**"]

[tool.ty.overrides.rules]
all = "ignore"
